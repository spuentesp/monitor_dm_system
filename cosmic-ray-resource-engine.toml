[cosmic-ray]
module-path = "packages/agents/src/monitor_agents/resource_engine.py"
python-version = ""
timeout = 20
excluded-modules = []
test-command = "uv run pytest packages/agents/tests/test_resource_engine.py packages/agents/tests/test_resource_derivation.py -q"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.operators]
# Resource engine is numeric-heavy (dice pools, modifiers, thresholds).
enabled = [
    "core/Boolean",
    "core/Break",
    "core/Continue",
    "core/Deletion",
    "core/Number",
    "core/Variable",
]
