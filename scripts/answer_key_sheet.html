<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claim Answer Key</title>
<style>
:root{--bg:#f3f5f4;--panel:#fff;--fg:#17201d;--muted:#5a6863;--line:#d5dcd9;--accent:#0b6e5f;--on:#fff;--warn:#9a5b00;--font:system-ui,-apple-system,"Segoe UI",sans-serif;--read:Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root{--bg:#121917;--panel:#1b2421;--fg:#e6ecea;--muted:#9aa8a3;--line:#33403c;--accent:#4cc2ae;--on:#08201b;--warn:#e0a84e;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font)}
header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:10px max(16px,4vw);display:flex;flex-wrap:wrap;gap:12px;align-items:center;z-index:2}
header strong{font-size:15px}#count{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{flex:1 1 160px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}
main{max-width:820px;margin:0 auto;padding:18px max(16px,4vw) 60px;display:grid;gap:16px}
.meta{color:var(--muted);font-size:13px}.claim{font-size:20px;line-height:1.35;font-weight:600;margin:4px 0 0}
.source{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font:16px/1.55 var(--read);white-space:pre-wrap}
.context{color:var(--muted);font:14px/1.5 var(--read);white-space:pre-wrap;margin:0}
details summary{cursor:pointer;color:var(--accent);font-size:13px}details[open]{display:grid;gap:8px}
.field{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}.field>label{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:5px}button{font:inherit;cursor:pointer}
.opt{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 10px;font-size:13px}.opt[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-height:38px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.primary{background:var(--accent);color:var(--on);border:0;border-radius:5px;padding:9px 20px;font-weight:600}.plain{background:none;border:1px solid var(--line);color:var(--fg);border-radius:5px;padding:9px 14px}
#status{font-size:13px;color:var(--muted)}#status.bad{color:var(--warn)}.state{font-size:12px;padding:2px 7px;border-radius:9px;border:1px solid var(--line);color:var(--muted)}
.field>label{display:flex;gap:6px;align-items:center}
.ask{width:20px;height:20px;flex:none;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--accent);font-size:12px;font-weight:700;line-height:1}
.helpbtn{background:none;border:1px solid var(--line);color:var(--fg);border-radius:5px;padding:4px 12px;font-size:13px}
dialog{width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlghead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}
.dlghead h2{font-size:16px;margin:0}.dlgbody{padding:4px 16px 16px}
.dlgbody h3{font-size:14px;margin:18px 0 2px;scroll-margin-top:60px}.dlgbody .why{color:var(--muted);font-size:13px;margin:0 0 6px}
.dlgbody dt{font-weight:600;font-size:13px;margin-top:8px}.dlgbody dd{margin:0;font-size:13px}.dlgbody dd i{color:var(--muted)}
@media (max-width:560px){.field{grid-template-columns:1fr}.claim{font-size:18px}}
</style></head><body>
<header><strong>Claim Answer Key</strong><span id="count"></span><div class="bar"><i id="bar"></i></div><button class="helpbtn" id="helpbtn">What do these mean?</button></header>
<dialog id="help" aria-labelledby="helptitle"><div class="dlghead"><h2 id="helptitle">What each label means</h2><button class="plain" id="helpclose">Close</button></div><div class="dlgbody" id="helpbody"></div></dialog>
<main id="main"><p>Loading claims…</p></main>
<script>
const FIELDS=[
["support","Does the source say this?",["quoted","entailed","inferred","unsupported"]],
["scope","Applies to",["general_rule","setting_canon","single_example"]],
["force","Force",["must","may","usually","cannot","none"]],
["authority","Authority",["core_rule","optional_rule","gm_advice","in_world_fiction"]],
["dropped_condition","Drops a condition?",[true,false]],
["canon","Canon as written?",[true,false]]];
const HELP={
support:["Does the book actually say this?",{
 quoted:["Nearly the book's own words.","A round ends after every hero has acted."],
 entailed:["Not the same words, but it must be true if the book is.","Book: duels are fought with blades. Claim: duels involve weapons."],
 inferred:["A reasonable reading the book doesn't state.","The book shows one sample scene. Claim: each success grants 1 Momentum."],
 unsupported:["The book doesn't say this.","The cited text is about one character's cloak, but the claim is about trading rules."]}],
scope:["Who or what does it apply to?",{
 general_rule:["Applies in any game.","A failed attack ends the action."],
 setting_canon:["True of the book's world.","The northern kingdoms rarely go to war."],
 single_example:["One sample character, scene or named illustration.","Mira has three swords."]}],
force:["How strong is the statement? If it only describes what happens, choose none.",{
 must:["Required.","You must name your target before rolling."],
 may:["Allowed, but optional.","You may spend 2 points to run further."],
 usually:["The norm, with exceptions.","This usually takes one action."],
 cannot:["Forbidden.","You may not act twice in one turn."],
 none:["Just states something.","Small boats are easier to hide."]}],
authority:["What kind of text is it?",{
 core_rule:["A rule the game runs on.","Picking a lock is a skill test."],
 optional_rule:["The book offers it as a choice.","If your group finds maps slow, you may skip them."],
 gm_advice:["Guidance for running the game, not a mechanic.","Character deaths should be uncommon."],
 in_world_fiction:["A story, quote or lore describing the world, not a game mechanic.","Faith can be bought. The northern kingdoms rarely go to war."]}],
dropped_condition:["Did it lose a limit? Check the whole paragraph, not just one sentence.",{
 true:["The book limits this, and the claim doesn't say so.","The claim says moving grants a benefit, but the book requires passing a skill test first."],
 false:["Nothing that changes how it's used was left out.",""]}],
canon:["Should the game treat this as true, exactly as worded?",{
 true:["Fine as a rule or fact as worded.",""],
 false:["It's an example, it's misleading, or it needs fixing first.","Mira has three swords. It's quoted, but it's still not canon."]}]};
const NAMES={true:"yes",false:"no"};
const show=v=>NAMES[v]??String(v).replaceAll("_"," ");
let rows=[],answers={},at=0,current={};
const main=document.getElementById("main");
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const help=document.getElementById("help");
function openHelp(key){help.showModal();const t=key&&document.getElementById("help-"+key);if(t)t.scrollIntoView();else document.getElementById("helpbody").scrollTop=0}
function buildHelp(){const body=document.getElementById("helpbody");for(const [k,label,opts] of FIELDS){const [why,defs]=HELP[k];const h=el("h3",null,label);h.id="help-"+k;body.append(h,el("p","why",why));const dl=el("dl");for(const v of opts){const [text,eg]=defs[v];dl.append(el("dt",null,show(v)));const dd=el("dd",null,text);if(eg){dd.append(" ",el("i",null,"For example: "+eg))}dl.append(dd)}body.append(dl)}}
document.getElementById("helpbtn").onclick=()=>openHelp();
document.getElementById("helpclose").onclick=()=>help.close();
help.onclick=e=>{if(e.target===help)help.close()};
function progress(){const n=Object.keys(answers).length;document.getElementById("count").textContent=n+" of "+rows.length+" confirmed";document.getElementById("bar").style.width=(rows.length?100*n/rows.length:0)+"%"}
function nextOpen(from){for(let i=1;i<=rows.length;i++){const j=(from+i)%rows.length;if(!answers[rows[j].id])return j}return -1}
function render(){
 progress();main.replaceChildren();
 if(at<0){main.append(el("h2",null,"All "+rows.length+" claims are confirmed"),el("p",null,"Your labels are saved in answer-key.jsonl. You can close this tab, then stop the server."));const b=el("button","plain","Go back through them");b.onclick=()=>{at=0;render()};main.append(b);return}
 const r=rows[at],saved=answers[r.id];
 current={...(saved?saved.labels:r.prefill||{})};
 const head=el("div");const m=el("div","meta","Claim "+(at+1)+" of "+rows.length+" · page "+r.page+" · "+r.kind+(r.heading?" · "+r.heading:""));
 const st=el("span","state",saved?"confirmed":r.prefill?"suggested labels, please check":"no suggestion, please fill in");
 head.append(m,st,el("p","claim",r.statement));
 const d=el("details");const s=el("summary",null,"Show the paragraphs before and after");d.append(s);
 if(r.before)d.append(el("p","context",r.before));
 if(r.after)d.append(el("p","context",r.after));
 main.append(head,el("div","source",r.source));if(r.before||r.after)main.append(d);
 const form=el("div");form.style.display="grid";form.style.gap="9px";
 for(const [k,label,opts] of FIELDS){const f=el("div","field");const lab=el("label",null,label);const q=el("button","ask","?");q.title="What does this mean?";q.setAttribute("aria-label","What does "+label+" mean?");q.onclick=()=>openHelp(k);lab.append(q);f.append(lab);const o=el("div","opts");for(const v of opts){const b=el("button","opt",show(v));b.title=HELP[k][1][v][0];b.setAttribute("aria-pressed",current[k]===v);b.onclick=()=>{current[k]=v;[...o.children].forEach((c,i)=>c.setAttribute("aria-pressed",opts[i]===v));msg("")};o.append(b)}f.append(o);form.append(f)}
 const nl=el("div","field");nl.append(el("label",null,"Note (optional)"));const ta=el("textarea");ta.id="note";ta.value=saved?saved.note:"";nl.append(ta);form.append(nl);main.append(form);
 const a=el("div","actions");const ok=el("button","primary","Confirm and next");ok.onclick=()=>save(r,ta.value);const back=el("button","plain","Back");back.disabled=at===0;back.onclick=()=>{at=Math.max(0,at-1);render()};const skip=el("button","plain","Skip for now");skip.onclick=()=>{at=nextOpen(at);render()};a.append(ok,back,skip,el("span",null));const sm=el("span");sm.id="status";a.append(sm);main.append(a);
 window.scrollTo(0,0);ok.focus();
}
function msg(t,bad){const s=document.getElementById("status");if(s){s.textContent=t;s.className=bad?"bad":""}}
async function save(r,note){
 const missing=FIELDS.filter(([k])=>current[k]===undefined).map(([,l])=>l);
 if(missing.length){msg("Please choose: "+missing.join(", "),true);return}
 msg("Saving…");
 try{const res=await fetch("/answer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:r.id,labels:current,note})});
  if(!res.ok)throw new Error(res.status);
  answers[r.id]={id:r.id,labels:{...current},note};at=nextOpen(at);render();
 }catch(e){msg("Not saved. Check that the server is still running, then try again.",true)}
}
buildHelp();
fetch("/data").then(r=>r.json()).then(d=>{rows=d.rows;answers=d.answers;at=rows.findIndex(r=>!answers[r.id]);render()}).catch(()=>{main.replaceChildren(el("p",null,"Couldn't load the claims. Check that the server is running, then reload."))});
</script></body></html>
