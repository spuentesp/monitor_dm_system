test-command = "python -m pytest packages/agents/tests/test_npc_voice.py packages/agents/tests/test_npc_voice_universe_scoping.py packages/agents/tests/test_npc_voice_universe_scoping_mutations.py -x -q"

[cosmic-ray.distributor]
name = "local"
