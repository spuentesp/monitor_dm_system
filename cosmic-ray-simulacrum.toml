[cosmic-ray]
module-path = "packages/agents/src/monitor_agents/simulacrum/agent.py"
python-version = ""
timeout = 25
excluded-modules = []
test-command = "python -m pytest packages/agents/tests/test_simulacrum.py -x -q"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.operators]
# Simulacrum has council reconciliation logic — control-flow and boolean heavy.
enabled = [
    "core/Boolean",
    "core/Break",
    "core/Continue",
    "core/Deletion",
    "core/Number",
    "core/Variable",
]