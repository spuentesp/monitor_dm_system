# CF-11: Advance World Time
# =========================

id: "CF-11"
title: "Advance World Time"
category: "cf"
epic: 7
priority: "medium"
status: "done"

summary: |
  Per-story world clock the GM advances explicitly ("+3 days", "+2 hours", or
  to an absolute date). Deadlines flip to due/overdue deterministically and
  stage CF-8 proposals when crossed; the elapsed time, due/overdue deadlines
  and an off-screen NPC tick surface in the CF-7 prep briefing, and the CF-2
  recap payload gains a world-clock time line.

acceptance_criteria:
  - "The GM can advance time mid- or post-session with confirmation; the clock is monotonic and advancing is idempotent, with an audit log of advances."
  - "The next CF-7 briefing shows elapsed time, due/overdue deadlines and an off-screen NPC summary grounded in canon."
  - "Crossed deadlines are staged as pending ProposedChange items for CF-8 (never direct Neo4j writes) and surface as overdue in the threads view."
  - "The CF-2 last-session payload carries world_time and a time_line of advances."
  - "Only the session (universe) owner may advance time (SYS-6)."

depends_on: ["CF-7", "CF-2"]
blocks: []

