[cosmic-ray]
module-path = "packages/agents/src/monitor_agents/canonkeeper.py"
python-version = ""
timeout = 20
excluded-modules = []
test-command = "uv run pytest tests/behavior/test_canonkeeper_choreography_behavior.py -q"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.operators]
# CanonKeeper is reasoning-heavy: focus on control-flow and boolean logic.
# String mutations are low-value here (no string-parsing logic).
enabled = [
    "core/Boolean",
    "core/Break",
    "core/Continue",
    "core/Deletion",
    "core/Number",
    "core/Variable",
]
