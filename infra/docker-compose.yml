networks:
  monitor-network:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  mongodb-data:
  mongodb-configdb:
  qdrant-storage:
  minio-data:
  opensearch-data:
  postgres-data:
  redis-data:
