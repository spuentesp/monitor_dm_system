name: Mutation (diff)

on:
  pull_request:

concurrency:
  group: mutation-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-diff:
    runs-on: ubuntu-latest
    # Budget model: run_session caps each module's cosmic-ray exec at 600s;
    # 60 minutes absorbs ~6 touched modules with overhead. Larger PRs fail
    # closed with guidance (split the PR or run the gate locally).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen || uv sync
      - name: Mutation gate (zero survivors on changed lines)
        run: uv run python scripts/mutation_diff.py --base "${{ github.event.pull_request.base.sha }}"
