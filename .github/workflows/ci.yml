name: CI

on:
  push:
    branches: [master, main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, layers, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen || uv sync
      - name: Ruff
        run: uv run ruff check packages scripts
      - name: Layer boundaries
        run: uv run python scripts/check_layer_dependencies.py
      - name: mypy (strict, zero-error baseline)
        run: uv run mypy packages/data-layer/src packages/agents/src packages/cli/src packages/ui/backend/src --cache-dir /tmp/mypy-cache

  sealed-suite-guard:
    name: Sealed-suite guard (T_test)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard sealed verification suites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          ALLOW=$(python3 -c "import json,os,sys; labels=json.loads(os.environ['LABELS_JSON']); sys.stdout.write('--allow-sealed' if 'sealed-override' in labels else '')")
          # Run the guard FROM THE BASE REF: the PR being policed must not be
          # able to rewrite the check that polices it.
          git show "${BASE_SHA}:scripts/sealed_suite_guard.py" > /tmp/sealed_suite_guard_base.py
          python3 /tmp/sealed_suite_guard_base.py --base "${BASE_SHA}" ${ALLOW}

  tests:
    name: Hermetic test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen || uv sync
      # No network, fake keys (enforced by conftest.py). Includes tests/contracts,
      # tests/property, tests/behavior and tests/verification.
      - name: Tests
        if: github.event_name != 'push'
        run: uv run pytest packages tests -q --tb=short -p no:cacheprovider -n auto
      - name: Tests with coverage (master pushes only; branch coverage is slow)
        if: github.event_name == 'push'
        run: uv run pytest packages tests -q --tb=short -p no:cacheprovider -n auto --cov=packages --cov-branch --cov-report=xml
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/ui/frontend/package-lock.json
      - run: npm ci
      - name: Vitest
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
