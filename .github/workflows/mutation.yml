name: Mutation Tests

on:
  schedule:
    - cron: "0 3 * * 0"  # weekly, Sunday 3 AM UTC
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen || uv sync

      - name: Install cosmic-ray
        run: uv pip install "cosmic-ray>=8.0"

      - name: Initialize session
        run: uv run cosmic-ray init cosmic-ray.toml session.sqlite

      - name: Run mutation suite
        run: uv run cosmic-ray exec cosmic-ray.toml session.sqlite

      - name: Compute kill rate
        id: score
        run: |
          SCORE=$(uv run cr-report session.sqlite | python3 - <<'EOF'
          import sys, re
          text = sys.stdin.read()
          # cr-report prints "kill rate: XX.XX%" or "score: 0.XXXX"
          pct = re.search(r'kill rate[:\s]+(\d+\.?\d*)\s*%', text, re.IGNORECASE)
          dec = re.search(r'score[:\s]+(\d+\.\d+)', text, re.IGNORECASE)
          if pct:
              print(round(float(pct.group(1))))
          elif dec:
              print(round(float(dec.group(1)) * 100))
          else:
              print(0)
          EOF
          )
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "Mutation kill rate: $SCORE%"

      - name: Show full report
        run: uv run cr-report session.sqlite

      - name: Update badge Gist
        # Requires GIST_TOKEN (fine-grained PAT with Gist write access)
        # and MUTATION_GIST_ID (ID of a public Gist containing mutation-score.json).
        # See docs/contributing/BADGES.md for setup instructions.
        if: >
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
          secrets.GIST_TOKEN != '' &&
          secrets.MUTATION_GIST_ID != ''
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          MUTATION_GIST_ID: ${{ secrets.MUTATION_GIST_ID }}
          SCORE: ${{ steps.score.outputs.score }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.GIST_TOKEN }}
          script: |
            const score = parseInt(process.env.SCORE);
            const color = score >= 80 ? 'brightgreen' : score >= 60 ? 'yellow' : 'red';
            const badge = {
              schemaVersion: 1,
              label: 'mutation score',
              message: `${score}%`,
              color,
            };
            await fetch(`https://api.github.com/gists/${process.env.MUTATION_GIST_ID}`, {
              method: 'PATCH',
              headers: {
                Authorization: `token ${process.env.GIST_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                files: { 'mutation-score.json': { content: JSON.stringify(badge, null, 2) } },
              }),
            });
            console.log(`Badge updated: ${score}% (${color})`);
