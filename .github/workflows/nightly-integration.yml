name: Weekly Integration

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  integration:
    # ubuntu-24.04, not ubuntu-latest: the Playwright version this repo pins
    # (1.60) refuses to install its browsers on the ubuntu-26.04 image, and
    # the page smokes are the last step of this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Object storage runs on the local-folder backend on CI. The MinIO image
      # cannot be pulled on a GitHub runner: quay.io denies anonymous pulls of
      # quay.io/minio/minio (HTTP 401; the anonymous token carries no pull
      # actions) and the Docker Hub repo minio/minio no longer exists. The
      # data-layer supports folder mode natively (monitor_data.db.minio,
      # _LOCAL_BACKENDS) and the e2e suite already runs the same way.
      STORAGE_BACKEND: "folder"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen || uv sync

      - name: Prepare environment file
        run: |
          cp env.example .env
          cp env.example infra/.env || true
          # Keep .env in agreement with the job-level STORAGE_BACKEND=folder.
          sed -i 's/^STORAGE_BACKEND=.*/STORAGE_BACKEND=folder/' .env
          if [ -f infra/.env ]; then
            sed -i 's/^STORAGE_BACKEND=.*/STORAGE_BACKEND=folder/' infra/.env
          fi

      - name: Start data services
        run: |
          # minio is intentionally not started: its image cannot be pulled
          # anonymously (see the STORAGE_BACKEND job comment above).
          docker compose --env-file .env -f infra/docker-compose.yml up -d \
            neo4j mongodb qdrant redis postgres
          # Wait for health
          for i in $(seq 1 60); do
            running=$(docker ps --format '{{.Names}}' | grep -cE '^monitor-(neo4j|mongodb|qdrant|redis|postgres)$' || true)
            unhealthy=$(docker ps --format '{{.Names}} {{.Status}}' | grep -cE 'starting|unhealthy' || true)
            if [ "$running" -eq 5 ] && [ "$unhealthy" -eq 0 ]; then break; fi
            sleep 5
          done
          docker ps -a --format '{{.Names}}: {{.Status}}'
          # A service that never came up must fail the job here, with a legible
          # message, instead of surfacing later as a confusing test error.
          for svc in monitor-neo4j monitor-mongodb monitor-qdrant monitor-redis monitor-postgres; do
            if ! docker ps --format '{{.Names}}' | grep -qx "$svc"; then
              echo "::error::service $svc is not running"
              docker logs --tail 50 "$svc" || true
              exit 1
            fi
          done
          sick=$(docker ps --format '{{.Names}} {{.Status}}' | grep -E 'starting|unhealthy' || true)
          if [ -n "$sick" ]; then
            echo "::error::services did not become healthy: $sick"
            exit 1
          fi

      - name: Integration tests
        env:
          RUN_INTEGRATION: "1"
        run: uv run pytest packages tests -q -m integration --tb=short

      - name: Start FastAPI backend
        env:
          # The runner is isolated, ephemeral and has no accounts: the smoke
          # scripts drive the API directly. This is the documented
          # local-development exception (docs/architecture/MULTI_TENANCY_PLAN.md)
          # and it applies to this job only — never to a reachable host.
          MONITOR_AUTH_DISABLED: "true"
          # The Playwright smoke server answers on :3100, so the browser's
          # cross-origin calls to the API need that origin allowed.
          UI_CORS_ORIGINS: "http://localhost:3000,http://localhost:3100,http://127.0.0.1:3100"
        run: |
          nohup env PYTHONPATH="packages/data-layer/src:packages/agents/src:packages/ui/backend/src" \
            uv run uvicorn monitor_ui.main:app --app-dir packages/ui/backend/src --host 0.0.0.0 --port 8000 \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the FastAPI backend did not become healthy within 120s"
          cat /tmp/backend.log
          exit 1

      - name: Live tenancy smoke (auth-enabled backend + SMTP sink)
        # The two-user pass (UX-1/UX-2) must run with real authentication, so
        # it gets its own backend on :8002 with MONITOR_AUTH_DISABLED=false,
        # invite-only signup and SMTP pointed at a local sink. The first
        # admin is bootstrapped with scripts/create_admin.py, then
        # scripts/live_tenancy_smoke.py drives the API (invites, signup,
        # cross-tenant denial, forgot-password + reset, admin controls).
        run: |
          set -euo pipefail
          export PYTHONPATH="packages/data-layer/src:packages/agents/src:packages/ui/backend/src"
          rm -f /tmp/smtp_sink.jsonl /tmp/smtp_sink.log /tmp/backend8002.log

          # Fresh Fernet key per run: the auth-enabled backend refuses to save
          # provider keys without MONITOR_PROVIDER_KEY_ENCRYPTION_KEY (UX-4).
          ENC_KEY="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"

          # 1) SMTP sink (scripts/smtp_sink.py, stdlib asyncio). No STARTTLS.
          nohup uv run python scripts/smtp_sink.py --host 127.0.0.1 --port 2525 \
            --out /tmp/smtp_sink.jsonl > /tmp/smtp_sink.log 2>&1 &
          sink_up=0
          for i in $(seq 1 30); do
            if python3 -c "import socket; s=socket.create_connection(('127.0.0.1', 2525), 1); s.close()" 2>/dev/null; then
              echo "smtp sink accepting connections after ${i}s"
              sink_up=1
              break
            fi
            sleep 1
          done
          if [ "$sink_up" -ne 1 ]; then
            echo "::error::smtp_sink.py did not start"
            cat /tmp/smtp_sink.log || true
            exit 1
          fi

          # 2) Second backend with authentication ENABLED on :8002.
          #    Env vars override .env (pydantic-settings precedence), so the
          #    auth-disabled first backend and this one stay independent.
          nohup env PYTHONPATH="$PYTHONPATH" \
            MONITOR_AUTH_DISABLED=false \
            MONITOR_SIGNUP_MODE=invite \
            AUTH_COOKIE_SECURE=false \
            MONITOR_PROVIDER_KEY_ENCRYPTION_KEY="$ENC_KEY" \
            MONITOR_SMTP_HOST=127.0.0.1 \
            MONITOR_SMTP_PORT=2525 \
            MONITOR_SMTP_STARTTLS=false \
            MONITOR_SMTP_FROM=monitor@localhost \
            MONITOR_PUBLIC_URL=http://localhost:3000 \
            uv run uvicorn monitor_ui.main:app --app-dir packages/ui/backend/src \
              --host 0.0.0.0 --port 8002 \
            > /tmp/backend8002.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8002/api/health >/dev/null 2>&1; then
              echo "auth-enabled backend healthy after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8002/api/health >/dev/null 2>&1; then
            echo "::error::the auth-enabled backend :8002 did not become healthy within 120s"
            cat /tmp/backend8002.log
            exit 1
          fi

          # 3) First admin — signup is invite-only and never grants admin.
          #    --promote-existing keeps the step idempotent if the shared
          #    database already has this account from an earlier run.
          if ! uv run python scripts/create_admin.py \
            --email tenancy-admin@example.com --username tenancy_admin \
            --password 'SmokeAdminPassw0rd!' --promote-existing; then
            echo "::error::create_admin.py failed"
            cat /tmp/backend8002.log || true
            exit 1
          fi

          # 4) Two-user tenancy pass. Prints PASS/FAIL per step; non-zero on
          #    any FAIL, with the backend log and sink file on failure.
          rc=0
          uv run python scripts/live_tenancy_smoke.py \
            --base-url http://127.0.0.1:8002 \
            --admin-login tenancy-admin@example.com \
            --admin-password 'SmokeAdminPassw0rd!' \
            --sink /tmp/smtp_sink.jsonl || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::live tenancy smoke failed (exit $rc)"
            echo "--- backend :8002 log ---"
            cat /tmp/backend8002.log || true
            echo "--- smtp sink file (/tmp/smtp_sink.jsonl) ---"
            cat /tmp/smtp_sink.jsonl 2>/dev/null || true
            echo "--- smtp sink log ---"
            cat /tmp/smtp_sink.log 2>/dev/null || true
            exit "$rc"
          fi

      - name: E2E smoke
        env:
          RUN_E2E: "1"
        # The honest smoke (FINAL_FABLE T-027) drives a real GM turn, so it
        # needs a live LLM provider and a seeded universe. The weekly job has
        # no LLM: CI carries no provider credentials, so the backend starts
        # without a single usable chat provider. The step therefore reports
        # SKIPPED with the reason instead of failing the run — which is what
        # "tolerate absence until it lands" asks for. Give the job a provider
        # credential and a seeded universe and the smoke runs for real.
        run: |
          if [ ! -f scripts/live_gameplay_smoke.py ]; then
            echo "E2E smoke SKIPPED: scripts/live_gameplay_smoke.py is not in the tree"
            exit 0
          fi
          rc=0
          uv run python scripts/live_gameplay_smoke.py --check || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "E2E smoke SKIPPED: the live-play preconditions are not met (reason above)"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::the E2E smoke preflight failed"
            exit "$rc"
          fi
          uv run python scripts/live_gameplay_smoke.py

      - name: Frontend page smokes (Playwright)
        working-directory: packages/ui/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          NEXT_PUBLIC_API_URL=http://localhost:8000 npm run build
          npx playwright test

      - name: Teardown
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v
