name: Weekly Integration

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Object storage runs on the local-folder backend on CI. The MinIO image
      # cannot be pulled on a GitHub runner: quay.io denies anonymous pulls of
      # quay.io/minio/minio (HTTP 401; the anonymous token carries no pull
      # actions) and the Docker Hub repo minio/minio no longer exists. The
      # data-layer supports folder mode natively (monitor_data.db.minio,
      # _LOCAL_BACKENDS) and the e2e suite already runs the same way.
      STORAGE_BACKEND: "folder"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen || uv sync

      - name: Prepare environment file
        run: |
          cp env.example .env
          cp env.example infra/.env || true
          # Keep .env in agreement with the job-level STORAGE_BACKEND=folder.
          sed -i 's/^STORAGE_BACKEND=.*/STORAGE_BACKEND=folder/' .env
          if [ -f infra/.env ]; then
            sed -i 's/^STORAGE_BACKEND=.*/STORAGE_BACKEND=folder/' infra/.env
          fi

      - name: Start data services
        run: |
          # minio is intentionally not started: its image cannot be pulled
          # anonymously (see the STORAGE_BACKEND job comment above).
          docker compose --env-file .env -f infra/docker-compose.yml up -d \
            neo4j mongodb qdrant redis postgres
          # Wait for health
          for i in $(seq 1 60); do
            running=$(docker ps --format '{{.Names}}' | grep -cE '^monitor-(neo4j|mongodb|qdrant|redis|postgres)$' || true)
            unhealthy=$(docker ps --format '{{.Names}} {{.Status}}' | grep -cE 'starting|unhealthy' || true)
            if [ "$running" -eq 5 ] && [ "$unhealthy" -eq 0 ]; then break; fi
            sleep 5
          done
          docker ps -a --format '{{.Names}}: {{.Status}}'
          # A service that never came up must fail the job here, with a legible
          # message, instead of surfacing later as a confusing test error.
          for svc in monitor-neo4j monitor-mongodb monitor-qdrant monitor-redis monitor-postgres; do
            if ! docker ps --format '{{.Names}}' | grep -qx "$svc"; then
              echo "::error::service $svc is not running"
              docker logs --tail 50 "$svc" || true
              exit 1
            fi
          done

      - name: Integration tests
        env:
          RUN_INTEGRATION: "1"
        run: uv run pytest packages tests -q -m integration --tb=short

      - name: Start FastAPI backend
        env:
          # The runner is isolated, ephemeral and has no accounts: the smoke
          # scripts drive the API directly. This is the documented
          # local-development exception (docs/architecture/MULTI_TENANCY_PLAN.md)
          # and it applies to this job only — never to a reachable host.
          MONITOR_AUTH_DISABLED: "true"
          # The Playwright smoke server answers on :3100, so the browser's
          # cross-origin calls to the API need that origin allowed.
          UI_CORS_ORIGINS: "http://localhost:3000,http://localhost:3100,http://127.0.0.1:3100"
        run: |
          nohup env PYTHONPATH="packages/data-layer/src:packages/agents/src:packages/ui/backend/src" \
            uv run uvicorn monitor_ui.main:app --app-dir packages/ui/backend/src --host 0.0.0.0 --port 8000 \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the FastAPI backend did not become healthy within 120s"
          cat /tmp/backend.log
          exit 1

      - name: E2E smoke
        env:
          RUN_E2E: "1"
        # The honest smoke (FINAL_FABLE T-027) drives a real GM turn, so it
        # needs a live LLM provider and a seeded universe. The weekly job has
        # neither: CI carries no provider credentials and starts with empty
        # databases. The step therefore reports SKIPPED with the reason
        # instead of failing the run — which is what "tolerate absence until
        # it lands" asks for. Give the job a provider credential and a seeded
        # universe and the smoke runs for real.
        run: |
          if [ ! -f scripts/live_gameplay_smoke.py ]; then
            echo "E2E smoke SKIPPED: scripts/live_gameplay_smoke.py is not in the tree"
            exit 0
          fi
          rc=0
          python3 - <<'PY' || rc=$?
          import json
          import urllib.request

          BASE = "http://127.0.0.1:8000/api"


          def get(path):
              with urllib.request.urlopen(BASE + path, timeout=30) as response:
                  return json.load(response)


          problems = []
          try:
              providers = get("/llm/providers")
          except Exception as exc:
              problems.append(f"the LLM provider list is not readable ({exc})")
              providers = []
          if not [p for p in providers if p.get("api_key_masked")]:
              problems.append("no LLM provider holds credentials")
          try:
              universes = get("/universes/universes")
          except Exception as exc:
              problems.append(f"the universe list is not readable ({exc})")
              universes = []
          if not universes:
              problems.append("no universe is seeded")
          if problems:
              print("E2E smoke SKIPPED: " + "; ".join(problems))
              raise SystemExit(3)
          print("E2E smoke: live-play preconditions are met")
          PY
          if [ "$rc" -eq 3 ]; then
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::the E2E smoke preflight failed"
            exit "$rc"
          fi
          uv run python scripts/live_gameplay_smoke.py

      - name: Frontend page smokes (Playwright)
        working-directory: packages/ui/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          NEXT_PUBLIC_API_URL=http://localhost:8000 npm run build
          npx playwright test

      - name: Teardown
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v
