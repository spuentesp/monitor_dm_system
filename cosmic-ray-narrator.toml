[cosmic-ray]
module-path = "packages/agents/src/monitor_agents/narrator/agent.py"
python-version = ""
timeout = 30
excluded-modules = []
test-command = "python -m pytest packages/agents/tests/test_narrator.py packages/agents/tests/test_narrator_hallucination_guard.py packages/agents/tests/test_narrator_refines.py tests/behavior/test_narrator_choreography_behavior.py -x -q --timeout=15 --tb=line -p no:cacheprovider --no-header"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.operators]
# Narrator has control-flow for turn handling and string logic for prose.
enabled = [
    "core/Boolean",
    "core/Break",
    "core/Continue",
    "core/Deletion",
    "core/Number",
    "core/String",
    "core/Variable",
]