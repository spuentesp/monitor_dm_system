# =============================================================================
# MONITOR UI Backend
# =============================================================================
# Sits above CLI (Layer 3) as a peer interface layer.
# IMPORTS FROM: monitor-data-layer (Layer 1) for config/health
#               monitor-agents (Layer 2) for agent calls
# =============================================================================

[project]
name = "monitor-ui-backend"
version = "0.1.0"
description = "MONITOR UI Backend — FastAPI server for the web interface"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "monitor-data-layer",
    "fastapi>=0.108",
    "uvicorn[standard]>=0.25",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "websockets>=12.0",
    "httpx>=0.27",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
agents = ["monitor-agents"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
]

[project.scripts]
monitor-ui = "monitor_ui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor_ui"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.uv.sources]
monitor-data-layer = { workspace = true }
monitor-agents = { workspace = true }
