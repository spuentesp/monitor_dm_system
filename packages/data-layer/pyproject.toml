# =============================================================================
# MONITOR Data Layer
# =============================================================================
# LAYER 1 of 3 - This is the BOTTOM layer of the MONITOR stack.
#
# DEPENDENCY RULES (CRITICAL):
#   - This package has NO dependencies on other MONITOR packages
#   - This package ONLY depends on external libraries + databases
#   - Agents (Layer 2) depend on THIS package
#   - CLI (Layer 3) does NOT directly depend on this package
#
# RESPONSIBILITIES:
#   - Database clients (Neo4j, MongoDB, Qdrant, MinIO)
#   - MCP server and tools
#   - Pydantic schemas for data validation
#   - Authority enforcement middleware
#
# =============================================================================

[project]
name = "monitor-data-layer"
version = "0.1.0"
description = "MONITOR Data Layer - MCP server for canonical graph, narrative documents, and semantic search"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    # Database clients (ASYNC)
    "neo4j>=5.15",           # AsyncGraphDatabase built-in
    "pytz",                  # Required by neo4j for temporal hydration
    "motor>=3.3",            # REPLACES pymongo — async MongoDB driver
    "qdrant-client>=1.7",    # AsyncQdrantClient built-in
    "aiobotocore>=2.7",      # REPLACES minio SDK for async S3/MinIO
    "opensearch-py>=2.4",    # AsyncOpenSearch built-in
    # MCP and API
    "mcp[cli]>=1.2.0",
    "anthropic>=0.39",
    "fastapi>=0.108",
    "uvicorn>=0.25",
    # Data validation + config
    "pydantic>=2.5",
    "pydantic-settings>=2.2",  # type-safe settings from .env
    # Embeddings (provider-agnostic)
    "litellm>=1.0",            # text-embedding-3-small via LiteLLM for provider flexibility
    # Document ingestion
    "pymupdf>=1.24",           # PDF parsing (fitz) — fastest, handles complex layouts
    "tiktoken>=0.7",           # token counting for chunking
    "beautifulsoup4>=4.12",    # HTML/EPUB tag stripping (optional: falls back to regex)
    "python-docx>=1.1",        # Word .docx extraction
    "ebooklib>=0.18",          # EPUB e-book extraction
    "httpx>=0.27",             # async URI fetching in Indexer agent
    # Reliability
    "tenacity>=8.2",           # retry logic for DB ops
    # Relational DB (app config, settings, LLM providers)
    "asyncpg>=0.29",           # async PostgreSQL driver
    # Runtime cache / pub-sub
    "redis>=5.2",              # optional but recommended for hot-path caching and queue coordination
    "rapidfuzz>=3.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.12",
    "testcontainers>=4.0",
    "black>=23.12",
    "mypy>=1.7",
    "ruff>=0.1",
]

[project.scripts]
monitor-data = "monitor_data.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor_data"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
