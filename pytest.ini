[pytest]
testpaths =
    packages
    tests
norecursedirs =
    infra
    .git
    .venv
    node_modules
    dist
    build
markers =
    unit: Fast, isolated tests.
    integration: Cross-component tests (skip unless RUN_INTEGRATION=1).
    e2e: End-to-end/system tests (skip unless RUN_E2E=1).
asyncio_mode = auto
# Hermetic-suite guardrail: any single test that runs longer than this is a
# bug (hung network call), not a slow test. Integration/e2e tests can raise
# it per-test with @pytest.mark.timeout(...).
timeout = 60
timeout_method = thread
